[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crisp-clear-training-and-deployment"
version = "0.0.0"
description = "Reproduce CRISP and CLEAR training, sampled deployment, statistical decisions, and FPGA measurements"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.3.5", "scipy==1.17.0", "torch==2.11.0",
  "PyYAML==6.0.3", "tqdm==4.70.1", "h5py==3.16.0"
]

[project.optional-dependencies]
state-space = ["spikingjelly==0.0.0.0.14", "torchvision==0.26.0", "hydra-core==1.3.2", "omegaconf==2.3.0", "einops==0.8.2"]
test = ["pytest==9.1.1"]

[project.scripts]
crisp-reproduce = "reproduce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "hardware/tests"]
