[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crisp-clear-training-and-deployment"
version = "0.0.0"
description = "Reproduce CRISP and CLEAR training, sampled deployment, statistical decisions, and FPGA measurements"
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
  "spiking-neural-networks", "neuromorphic-computing", "continuous-time",
  "mean-field-training", "local-learning", "stochastic-inference",
  "sampler-sharpening", "statistical-certification", "fpga",
  "energy-measurement", "reproducible-research", "formal-verification"
]
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.3.5", "scipy==1.17.0", "torch==2.11.0",
  "PyYAML==6.0.3", "tqdm==4.70.1", "h5py==3.16.0"
]

[project.optional-dependencies]
state-space = ["spikingjelly==0.0.0.0.14", "torchvision==0.26.0", "hydra-core==1.3.2", "omegaconf==2.3.0", "einops==0.8.2"]
test = ["pytest==9.1.1"]

[project.scripts]
crisp-reproduce = "reproduce.cli:main"

[project.urls]
Repository = "https://github.com/DrCanD/crisp-clear-training-and-deployment"
Documentation = "https://github.com/DrCanD/crisp-clear-training-and-deployment/blob/main/README.md"
Issues = "https://github.com/DrCanD/crisp-clear-training-and-deployment/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/*.txt", "licenses/THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "hardware/tests"]
