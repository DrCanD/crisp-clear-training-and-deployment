experiment: runtime_benchmark
device: cuda
output: outputs/runtime_benchmark
model:
  n_in: 700
  n_hidden: 256
  n_layers: 2
  k_modes: 8
  n_classes: 35
  hidden_dropout: 0.2
  ct_exact: true
  zoh_b: true
  norm_type: batchnorm
  readout_pool: mean
  beta_end: 5.0
benchmark:
  timesteps:
  - 100
  - 250
  - 500
  - 1000
  - 2000
  - 5000
  - 10000
  batch_sizes:
  - 64
  batch_sweep_timesteps:
  - 100
  - 1000
  batch_sweep_sizes:
  - 16
  - 32
  - 64
  - 128
  - 256
  - 512
  - 1024
  latency_timesteps:
  - 100
  - 1000
  - 10000
  implementations:
  - crisp_hillis
  - crisp_chunked
  - crisp_fft
  - crisp_toeplitz
  - crisp_chunkmm
  - crisp_fused
  - lif_loop
  - lif_compiled
  - lif_fused
  - lif_fused2
  - lif_xla_scan
  - spsn_sb
  warmup: 3
  repeats: 15
  min_repeats: 3
  unit_budget_seconds: 30
  max_step_seconds: 60
  max_first_seconds: 900
  toeplitz_memory_fraction: 0.6
  xla_memory_fraction: 1.0
  gate_timesteps: 1000
  chunk_length: 64
  input_density: 0.05
  tf32: true
  spsn_path: external_code/spsn
  fetch_dependencies: false
