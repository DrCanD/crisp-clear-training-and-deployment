experiment: certification
dataset:
  name: shd
  path: data/processed/shd.npz
device: cuda
seeds:
- 42
- 123
- 999
model:
  n_hidden: 256
  n_layers: 2
  k_modes: 8
  complex_poles: false
  zoh_b: true
  norm_type: batchnorm
  readout_pool: mean
  ct_exact: true
  hidden_dropout: 0.2
training:
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  batch_size: 128
  n_epochs: 100
  patience: 20
  schedule: cosine
  eval_seed: 2026
  tf32: true
  aug:
    aug_jitter: 4
    aug_chdrop: 0.05
    aug_tmask: 20
official_source: external_code/pspikessm
output: outputs/certification_shd
jobs:
- name: crisp_meanfield
  family: crisp
  rule: meanfield
  beta_start: 1.0
  beta_end: 5.0
  anneal_frac: 0.7
  checkpoint: outputs/deployment_gap_shd/checkpoints/crisp_meanfield/seed_{seed}/best_model.pt
- name: pspikessm_native
  family: pspikessm
  rule: sample_ste
  beta_start: 1.0
  beta_end: 1.0
  anneal_frac: 0.7
  checkpoint: outputs/deployment_gap_shd/checkpoints/pspikessm_native/seed_{seed}/best_model.pt
  draw_seeds:
    42: 311652487
    123: 2031777048
    999: 717460641
- name: pspikessm_meanfield
  family: pspikessm
  rule: meanfield
  beta_start: 1.0
  beta_end: 1.0
  anneal_frac: 0.7
  checkpoint: outputs/deployment_gap_shd/checkpoints/pspikessm_meanfield/seed_{seed}/best_model.pt
  draw_seeds:
    42: 844388143
    123: 1430881148
    999: 352801977
certification:
  certificate_draws: 256
  reference_draws: 256
  group_sizes:
  - 1
  - 2
  - 4
  - 8
  - 16
  alphas:
  - 0.01
  - 0.001
  reference_alpha: 0.001
  batch_size: 64
  draw_chunk: 8
  maximum_forward_rows: 8192
  draw_seed: 20260930
  tf32: false
