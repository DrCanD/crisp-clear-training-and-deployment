# TPU counterpart of the matched runtime benchmark. Use the separate
# environments/tpu-requirements.txt environment on a single TPU v6e chip.
experiment: runtime_benchmark
device: xla
output: outputs/runtime_benchmark_tpu
model:
  n_in: 700
  n_hidden: 256
  n_layers: 2
  k_modes: 8
  n_classes: 35
  hidden_dropout: 0.2
  ct_exact: true
  zoh_b: true
  norm_type: batchnorm
  readout_pool: mean
  beta_end: 5.0
benchmark:
  timesteps:
  - 100
  - 250
  - 500
  - 1000
  - 2000
  - 5000
  - 10000
  batch_sizes:
  - 64
  implementations:
  - crisp_chunkmm
  - crisp_toeplitz
  - lif_xla_scan
  warmup_gpu: 3
  warmup_xla: 5
  repeats: 15
  min_repeats: 3
  unit_budget_seconds: 30
  max_step_seconds: 60
  max_first_seconds: 900
  toeplitz_memory_fraction: 0.6
  xla_memory_fraction: 1.0
  xla_matmul_precision: highest
  gate_timesteps: 1000
  chunk_length: 64
  input_density: 0.05
  tf32: true
