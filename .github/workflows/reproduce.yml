name: Reproduction checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,state-space]"
          python -m pip check
      - name: Check implementation and evidence
        run: |
          python -m reproduce test
          python -m reproduce check-gradients
          python -m reproduce analyse-reference
          python hardware/analyze_power.py
      - name: Check portable C++ inference
        run: |
          python hardware/build.py --variant sampled --stage verify --inputs 1
          python hardware/build.py --variant mf --stage verify --inputs 1

  proofs:
    name: Lean / 30 theorems
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELAN_HOME: ${{ runner.temp }}/elan
      LEAN_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned elan
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz' | sha256sum --check
          tar --extract --gzip --file elan.tar.gz
          ./elan-init -y --no-modify-path --default-toolchain none
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependencies and check proofs
        run: python proofs/verify.py --setup
      - name: Check proofs without dependency updates
        run: python proofs/verify.py
      - name: Record proof verification and controls
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path('outputs/proofs').glob('*')):
              if path.is_file() and path.suffix in {'.json', '.log'}:
                  print(f'::group::{path.as_posix()}', flush=True)
                  print(path.read_text(encoding='utf-8'), flush=True)
                  print('::endgroup::', flush=True)
          PY
